name: CI

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required source-of-truth files
        run: |
          set -eu
          for f in MASTER.md DESIGN.md ANTI-SLOP.md DECISIONS.md ROADMAP.md TASKS.md STATE.md CHECKPOINT.md AGENTS.md MASTER-PROMPT.md README.md LICENSE; do
            test -f "$f"
          done
