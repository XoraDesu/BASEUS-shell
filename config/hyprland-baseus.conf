# BASEUS — Synchronized Hyprland Reference Configuration
# Copyright (c) 2026 xoradesu — MIT License
#
# Governed by MASTER.md §28–29, §34, DESIGN.md §28, DEC-028, and ANTI-SLOP.md:
#   - Action-first input philosophy (Discover → Customize → Execute)
#   - Direct mapping between declarative Hyprland keybinds and Quickshell IPC endpoints
#   - Multi-finger gesture mappings (3-finger & 4-finger swipes, pinch gestures)
#   - Freeform floating-first window model (DEC-008) with zero scratchpads (DEC-038)
#   - Zero blur, zero neon glow, 1px subtle Wabi-sabi borders (ANTI-SLOP.md)

# =========================================================
# Monitor Geometry Configuration
# =========================================================
monitor = , preferred, auto, auto
monitor = VIRTUAL-1, 1920x1080@60, 0x0, 1
monitor = VIRTUAL-2, 1920x1080@60, 1920x0, 1
monitor = VIRTUAL-3, 1920x1080@60, 3840x0, 1
monitor = VIRTUAL-4, 1920x1080@60, 5760x0, 1

# =========================================================
# General Compositor Rules (Wabi-sabi Foundation)
# =========================================================
general {
    border_size = 1
    gaps_in = 8
    gaps_out = 16
    resize_on_border = true
    allow_tearing = false
    col.active_border = rgba(7aa2f7ff)
    col.inactive_border = rgba(292e42ff)
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = false
    }

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(13131acc)
    }
}

animations {
    enabled = true
    workspace_wraparound = false

    bezier = baseusFocus, 0.22, 1.0, 0.36, 1.0
    bezier = baseusContext, 0.40, 0.0, 0.20, 1.0

    animation = global, 1, 2.4, baseusFocus
    animation = border, 1, 2.0, baseusFocus
    animation = windows, 1, 2.2, baseusFocus, popin 92%
    animation = windowsIn, 1, 2.2, baseusFocus, popin 92%
    animation = windowsOut, 1, 1.6, baseusContext, popin 94%
    animation = fade, 1, 2.0, baseusContext
    animation = layers, 1, 1.8, baseusFocus, fade
    animation = workspaces, 1, 1.8, baseusContext, fade
}

binds {
    allow_workspace_cycles = false
}

# =========================================================
# Touchpad Gestures (MASTER.md §28–29, DEC-028)
# =========================================================
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 4
    workspace_swipe_create_new = false
    workspace_swipe_forever = false
    workspace_swipe_distance = 300
    workspace_swipe_min_speed_to_force = 30
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = 0x16161e
    mouse_move_focuses_monitor = true
}

# =========================================================
# Window Management Rules (DEC-008, DEC-038)
# =========================================================
# Freeform floating & centered new windows by default (DEC-008)
windowrulev2 = float, class:.*
windowrulev2 = center, class:.*

# Minimized window suppression without scratchpads (DEC-038)
windowrulev2 = opacity 0.0 override 0.0 override, tag:baseus_minimized
windowrulev2 = nofocus, tag:baseus_minimized
windowrulev2 = noanim, tag:baseus_minimized
windowrulev2 = noshadow, tag:baseus_minimized
windowrulev2 = noblur, tag:baseus_minimized
windowrulev2 = bordersize 0, tag:baseus_minimized

$mainMod = SUPER

# =========================================================
# Workspaces 1..10 (DEC-010)
# =========================================================
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Window drag and resize with pointer
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# =========================================================
# Primary Surfaces & Session Overlays (M2/M5, DEC-028)
# =========================================================
bind = $mainMod, D, exec, quickshell ipc call baseus executeAction surface.app_drawer
bind = $mainMod, Space, exec, quickshell ipc call baseus executeAction surface.command_center
bind = $mainMod, Escape, exec, quickshell ipc call baseus executeAction surface.session_menu
bind = $mainMod, L, exec, quickshell ipc call baseus executeAction system.lock

# =========================================================
# Desktop Navigation Primitives (DEC-024, DEC-028)
# =========================================================
bind = ALT, Left, exec, quickshell ipc call baseus executeAction navigation.back
bind = $mainMod, H, exec, quickshell ipc call baseus executeAction navigation.home
bind = $mainMod, Tab, exec, quickshell ipc call baseus executeAction navigation.overview

# =========================================================
# Hardware Function Keys — Audio / Media / Brightness (M3/M5)
# =========================================================
bind = , XF86AudioPlay, exec, quickshell ipc call baseus executeAction media.toggle
bind = , XF86AudioNext, exec, quickshell ipc call baseus executeAction media.next
bind = , XF86AudioPrev, exec, quickshell ipc call baseus executeAction media.previous
bind = , XF86AudioRaiseVolume, exec, quickshell ipc call baseus executeAction audio.volume_up
bind = , XF86AudioLowerVolume, exec, quickshell ipc call baseus executeAction audio.volume_down
bind = , XF86AudioMute, exec, quickshell ipc call baseus executeAction audio.mute
bind = , XF86MonBrightnessUp, exec, quickshell ipc call baseus executeAction brightness.up
bind = , XF86MonBrightnessDown, exec, quickshell ipc call baseus executeAction brightness.down

