# BASEUS — Hyprland Desktop Core Configuration Preset (Hyprlang < 0.57 Reference)
# Copyright (c) 2026 xoradesu — MIT License
#
# Companion preset for distributions running Hyprland < 0.57 (Hyprlang config).
# Implements identical M1 Desktop Core rules as config/hypr/baseus-desktop.lua:
#   - Fixed 10 workspaces (Super+1..0, Super+Shift+1..0, 4-finger swipe)
#   - Context-fade workspace transitions (no physical desktop slide)
#   - Freeform floating & centered new windows by default (DEC-008)
#   - Subtle 1px Wabi-sabi tonal borders without blur or neon glow (DESIGN.md §34)
#   - No scratchpad bindings (DEC-038)

monitor = , preferred, auto, auto
monitor = VIRTUAL-1, 1920x1080@60, 0x0, 1
monitor = VIRTUAL-2, 1920x1080@60, 1920x0, 1
monitor = VIRTUAL-3, 1920x1080@60, 3840x0, 1
monitor = VIRTUAL-4, 1920x1080@60, 5760x0, 1

general {
    border_size = 1
    gaps_in = 8
    gaps_out = 16
    resize_on_border = true
    allow_tearing = false
    col.active_border = rgba(7aa2f7ff)
    col.inactive_border = rgba(292e42ff)
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = false
    }

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(13131acc)
    }
}

animations {
    enabled = true
    workspace_wraparound = false

    bezier = baseusFocus, 0.22, 1.0, 0.36, 1.0
    bezier = baseusContext, 0.40, 0.0, 0.20, 1.0

    animation = global, 1, 2.4, baseusFocus
    animation = border, 1, 2.0, baseusFocus
    animation = windows, 1, 2.2, baseusFocus, popin 92%
    animation = windowsIn, 1, 2.2, baseusFocus, popin 92%
    animation = windowsOut, 1, 1.6, baseusContext, popin 94%
    animation = fade, 1, 2.0, baseusContext
    animation = layers, 1, 1.8, baseusFocus, fade
    animation = workspaces, 1, 1.8, baseusContext, fade
}

binds {
    allow_workspace_cycles = false
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 4
    workspace_swipe_create_new = false
    workspace_swipe_forever = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = 0x16161e
    mouse_move_focuses_monitor = true
}

# Freeform floating & centered new windows by default (DEC-008)
windowrulev2 = float, class:.*
windowrulev2 = center, class:.*

$mainMod = SUPER

# Fixed 10 workspaces (DEC-010) — no scratchpad bindings (DEC-038)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
