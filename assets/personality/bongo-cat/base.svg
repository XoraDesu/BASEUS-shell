<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 70" width="100" height="70">
  <defs>
    <style>
      .stroke-main { stroke: #11111b; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .fill-body { fill: #ffffff; }
      .fill-inner-ear { fill: #f5c2e7; }
      .fill-blush { fill: #f38ba8; opacity: 0.6; }
      .fill-desk { fill: #1e1e2e; }
    </style>
  </defs>

  <!-- Table / Desk Surface -->
  <g id="desk">
    <line x1="2" y1="58" x2="98" y2="58" class="stroke-main" stroke-width="2" />
  </g>

  <!-- Cat Silhouette: Body & Head & Ears -->
  <g id="body">
    <!-- Main Body Contour -->
    <path class="stroke-main fill-body" d="
      M 24,58
      C 22,44 24,30 27,25
      C 27,21 28,14 32,10
      C 35,14 37,18 41,21
      C 46,19 54,19 59,21
      C 63,18 65,14 68,10
      C 72,14 73,21 73,25
      C 76,30 78,44 76,58
      Z
    " />

    <!-- Left Inner Ear -->
    <path class="fill-inner-ear" d="
      M 29,23
      C 29.5,18 30.5,14 32.5,12.5
      C 34.5,15 36,19 38,21
      Z
    " />

    <!-- Right Inner Ear -->
    <path class="fill-inner-ear" d="
      M 71,23
      C 70.5,18 69.5,14 67.5,12.5
      C 65.5,15 64,19 62,21
      Z
    " />

    <!-- Facial Expressions -->
    <!-- Left Eye (Happy closed arch) -->
    <path class="stroke-main" fill="none" stroke-width="1.8" d="M 37,34 C 39,30 43,30 45,34" />

    <!-- Right Eye (Happy closed arch) -->
    <path class="stroke-main" fill="none" stroke-width="1.8" d="M 55,34 C 57,30 61,30 63,34" />

    <!-- Left Cheek Blush -->
    <ellipse cx="33" cy="38" rx="3.5" ry="2" class="fill-blush" />

    <!-- Right Cheek Blush -->
    <ellipse cx="67" cy="38" rx="3.5" ry="2" class="fill-blush" />

    <!-- Cat Mouth (:3) -->
    <path class="stroke-main" fill="none" stroke-width="1.4" d="
      M 46,39
      C 47,42 49.5,42 50,40
      C 50.5,42 53,42 54,39
    " />
  </g>
</svg>

