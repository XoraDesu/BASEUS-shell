<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 70" width="100" height="70">
  <defs>
    <style>
      .stroke-main { stroke: #11111b; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .fill-body { fill: #ffffff; }
      .stroke-detail { stroke: #11111b; stroke-width: 1.2; stroke-linecap: round; }
    </style>
  </defs>

  <g id="paw-right">
    <!-- Right Paw Silhouette -->
    <path class="stroke-main fill-body" d="
      M 74,42
      C 78,46 83,52 78,57
      C 75,60 67,60 64,56
      C 62,53 62,47 66,44
      Z
    " />

    <!-- Paw Toe Separation Marks -->
    <path class="stroke-detail" fill="none" d="M 73,58 C 72,56 72,54 73,53" />
    <path class="stroke-detail" fill="none" d="M 69,58 C 68,56 68,54 69,53" />
  </g>
</svg>

